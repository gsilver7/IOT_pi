services:
  iot-pi-client:
    build:
      context: ./front
    container_name: iot-pi-client
    networks:
      - iot-pi-network

  iot-pi-server:
    build:
      context: ./backend
    container_name: iot-pi-server
    env_file:
      - ./backend/.env # .env 파일 경로
    networks:
      - iot-pi-network

  iot-pi-proxy:
    image: nginx:alpine
    container_name: iot-pi-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - iot-pi-network
    restart: unless-stopped

networks:
  iot-pi-network:
    driver: bridge
